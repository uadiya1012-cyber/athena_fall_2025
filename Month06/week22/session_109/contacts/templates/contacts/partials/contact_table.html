<article>
    <header>
        <strong>Add new contact</strong>
    </header>
    <form
        hx-post="{% url 'create_contact' %}"
        hx-target="#contact-container"
        hx-swap="innerHTML"
    >
        {% csrf_token %}

        <fieldset role="group">
            {{ form.name }}
            {{ form.email }}
            {{ form.phone }}
            <button type="submit">
                Add
                <span class="htmx-indicator" aria-busy="true">

                </span>

            </button>

        </fieldset>

        {% if form.errors %}
            <small style="color: var(--pico-del-color);">
                {% for field in form %}
                    {% for error in field.errors %}
                        {{ field.label }}: {{ error }}
                    {% endfor %}
                {% endfor %}
            </small>
        {% endif %}
    </form>
</article>

{% if message %}
    <div class="flash">
        {{ message }}
    </div>
{% endif %}

<figure>
    <table role="grid">
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Phone</th>
                <th scope="col">Actions</th>
            </tr>
        </thead>
        <tbody id="contact-tbody">
            {% for contact in contacts %}
                {% include 'contacts/partials/contact_row.html' %}
            {% empty %}
                <tr>
                    <td colspan="4">
                        <em>No contacts yet. Add one above.</em>
                    </td>
                </tr>


            {% endfor %}

        </tbody>

    </table>
</figure>
