version: '3.8'

services:

  #backend django service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: django_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_DEBUG=1
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - app_network

  # React frontend service
  frontend:
    image: node:20-slim
    container_name: react_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      bash -c "npm install &&
              npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
