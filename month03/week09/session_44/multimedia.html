<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <section>
            <h1>About HTML Integration</h1>
            <iframe src="about.html" frameborder="0"></iframe>
        </section>
        <section>
            <h1>Google map</h1>

        </section>
        <section>
            <h1>Youtube Integration</h1>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/gpjtmua5uGo?si=jTD64Z0EfG5-i6DM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

                <source src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4">

        <section>
            <h1>Audio Tag</h1>
            <audio controls src="duu.wav"></audio>
        </section>

</html>
