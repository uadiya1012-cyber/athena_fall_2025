<html>
    <head>
        <title>Form Intro</title>
    </head>

    <body>
        <h1>Хэрэглэгчээс мэдээлэл цуглуулах</h1>
        <form>
            <label for="username">Username:</label>
            <input id="username" type="text">
            <br>
            <label for="email">Email:</label>
            <input id="email" type="email">
            <br>
            <label for="password">Password:</label>
            <input id="password" type="password">
            <br>
            <input type="checkbox"> Нөхцөлийг зөвшөөрч байна.
            <br>
            <label for="gender">Gender:</label>
            <br>
            <input type="radio" name="gender" value="male"> Эрэгтэй
            <br>
            <input type="radio" name="gender" value="female"> Эмэгтэй
            <br>
            <input type="submit" value="Next">
        </form>

        <fieldset>
            <legend>Register</legend>
            <form>
                <input type="text" placeholder="Firstname">
                <br>
                <input type="text" placeholder="Lastname">
                <br>
                <input type="number" placeholder="Age">
                <br>
                <input type="email" placeholder="Email">
                <br>
                <input type="password" placeholder="Password">
                <br>
                <textarea name="feedback" id="feedback" placeholder="type..."></textarea>
                <br>
                <button>Register</button>
            </form>
        </fieldset>
    </body>
</html>
