<html>
    <head>
        <title>Table intro</title>
    </head>
    <body>
        <h1>Хүснэгт үүсгэх</h1>
        <table border="1">
            <tr>
                <th>№</th>
                <th>Нэр</th>
                <th>Хичээл</th>
                <th>Оноо</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Батаа</td>
                <td>Матетатик</td>
                <td>90</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Сараа</td>
                <td>Физик</td>
                <td>85</td>
            </tr>
        </table>

        <h2>Хичээлийн хуваарь</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>Өдөр</th>
                    <th>Хичээл</th>
                    <th>Цаг</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Даваа</td>
                    <td>HTML</td>
                    <td>09:00 - 10:30</td>
                </tr>
                <tr>
                    <td>Мягмар</td>
                    <td>CSS</td>
                    <td>10:40 - 12:10</td>
                </tr>
                <tr>
                    <td>Лхагва</td>
                    <td>Javascript</td>
                    <td>13:00 - 14:30</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Нийт 3 хичээл</td>
                </tr>
            </tfoot>
        </table>

        <h2>Row span</h2>
        <table border="1">
            <tr>
                <td rowspan="2">1</td>
                <td>2</td>
            </tr>
            <tr>
                <td>3</td>
            </tr>
        </table>
    </body>
</html>
