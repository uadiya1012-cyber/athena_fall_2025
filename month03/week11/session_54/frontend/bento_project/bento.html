<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Миний Bento Портфолио</title>
    <link rel="stylesheet" href="bento.css">
</head>

<body>

    <div class="container">
        <h1>Сайн уу, Намайг Адъяахүү гэдэг 👋</h1>
        <p>Вэб хөгжүүлэгч & Дизайнер</p>

        <div class="bento-grid">

            <div class="card profile">
                <img src="https://via.placeholder.com/150" alt="Avatar">
                <h2>Миний тухай</h2>
                <p>Би Python болон React ашиглан гоё зүйлс бүтээх дуртай.</p>
            </div>

            <div class="card social-1">Facebook</div>
            <div class="card social-2">Instagram</div>

            <div class="card skills">
                <h3>Ур чадвар</h3>
                <ul>
                    <li>HTML/CSS</li>
                    <li>Python</li>
                    <li>PostgreSQL</li>
                    <li>Figma</li>
                </ul>
            </div>

            <div class="card project-1">
                <h3>Сүүлийн Төсөл</h3>
                <p>TechZone App</p>
            </div>

            <div class="card location">
                <h3>Байршил</h3>
                <p>Улаанбаатар, Монгол</p>
            </div>

        </div>
    </div>

</body>

</html>
