{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Project</title>
    <link rel="stylesheet" href="{% static 'todos/css/styles.css' %}" />
</head>

<body>
    <div class="BG-image">
        <header style="display:flex;justify-content:space-evenly;align-items:center;">
            <h1>TODO</h1>
            <div id="theme-toggle" aria-label="Toggle theme">
                <img class="icon-moon" src="{% static 'todos/assets/icons/dark-mode.svg' %}" alt="Moon icon">
                <img class="icon-sun" src="{% static 'todos/assets/icons/light-mode.svg' %}" alt="Sun icon">
            </div>
        </header>
        <div class="container">
            <form id="todo-form" method="post" action="">
                {% csrf_token %}
                <input type="text" name="title" id="todo-input" placeholder="Create a new todo..." required />
                <button type="submit" id="add-btn">Add todo</button>

            </form>

            <ul id="todo-list">
                {% for todo in todos %}
                <li class="todo-item {% if todo.is_done %}done{% endif %}">
                    <div class="todo-main">
                        <strong>{{ todo.title }}</strong>
                        <small> — {{ todo.created_at|date:"Y-m-d H:i" }}</small>
                    </div>

                    <!--  -->
                    <div class="todo-actions">
                        <form method="post" action="" style="display:inline">
                            {% csrf_token %}
                            <input type="hidden" name="toggle_id" value="{{ todo.id }}" />
                            <button type="submit">{% if todo.is_done %}Mark pending{% else %}Mark done{% endif
                                %}</button>
                        </form>

                        <!-- устгах -->
                        <form method="post" action="" style="display:inline">
                            {% csrf_token %}
                            <input type="hidden" name="delete_id" value="{{ todo.id }}" />
                            <button type="submit"><img src="{% static 'todos/assets/icons/close.svg' %}"
                                    alt=""></button>
                        </form>
                    </div>
                </li>
                {% endif %}
                <li>No todos yet — add one above.</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
<script src="{% static 'todos/js/scripts.js' %}"></script>

</html>
