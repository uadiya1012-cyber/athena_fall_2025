<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .highlight {
            background-color: yellow;
            font-weight: bold;
        }

        .large {
            font-size: 32px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <h1 id="title">Text</h1>
    <div id="container"></div>
    <input type="text" name="username" id="username" value="Bold">
    <input type="number" name="age" id="age" value="25">
    <input type="email" name="email" id="email">

    <h2 id="hello">Hello</h2>

    <p id="text1" class="highlight">Text 1</p>
    <p id="text2">Text 2</p>

    <button id="showBtn">Show</button>
    <div id="content">Lorem ipsum dolor sit amet consectetur adipisicing elit. Officiis autem labore perspiciatis
        aliquam assumenda quas odio, placeat deleniti, dolorem aperiam laborum numquam accusamus sequi reiciendis
        exercitationem porro omnis officia pariatur.</div>

    <input type="text" id="task-input">
    <button id="add-task">Add</button>

    <ul id="task-list">
        <li>Task 1</li>
        <li>Task 2</li>
    </ul>

    <button id="deleteBtn">Delete</button>


    <script src="./js/index.js "></script>
</body>


</html>
