<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>

<body>
    <h1>Contact Us</h1>
    <p>Welcome to the contact page!</p>
    <ul>
        {% for contact in contacts %}
        <li>{{ contact.name }} - {{ contact.phone }}</li>
        {% empty %}
        <li>No contacts available.</li>
        {% endfor %}

    </ul>
</body>

</html>
