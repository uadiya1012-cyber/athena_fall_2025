<!-- templates/accounts/profile.html -->
{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Profile</h2>

    <div class="card">
        <div class="card-body">
            <table class="table">
                <tr>
                    <th>Username:</th>
                    <td>{{ user.username }}</td>
                </tr>
                <tr>
                    <th>Email:</th>
                    <td>{{ user.email }}</td>
                </tr>
                <tr>
                    <th>Name:</th>
                    <td>{{ user.get_full_name|default:"Not set" }}</td>
                </tr>
                <tr>
                    <th>Joined:</th>
                    <td>{{ user.date_joined|date:"F d, Y" }}</td>
                </tr>
            </table>

            <div class="mt-3">
                <a href="{% url 'profile_update' %}" class="btn btn-primary">Edit Profile</a>
                <a href="{% url 'password_change' %}" class="btn btn-secondary">Change Password</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
