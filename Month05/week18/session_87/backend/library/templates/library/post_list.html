{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'library/css/styles.css' %}">
</head>

<body>
    <h1>Posts</h1>
    <div class="container">
        <div class="grid">
            {% for post in posts %}
            <div class="card">
                <h3>{{ post.title }}</h3>
                <p>{{ post.content }}</p>
                <p>Published: {{ post.created_at|date:"F d, Y" }}</p>
            </div>
            {% empty %}
            <p>No posts found.</p>
            {% endfor %}
        </div>
    </div>


    <script src="{% static 'library/js/scripts.js' %}"></script>
</body>


</html>
