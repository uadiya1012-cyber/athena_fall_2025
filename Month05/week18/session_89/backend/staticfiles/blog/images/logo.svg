<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C19"></stop>
      <stop offset="100%" stop-color="#FE822C"></stop>
    </linearGradient>
  </defs>

  <!-- Background circle (optional) -->
  <circle cx="100" cy="100" r="90" fill="#0F0F0F"></circle>

  <!-- Main Letter A -->
  <text x="70" y="120" font-size="96" font-weight="700" font-family="Poppins, Inter, Arial, sans-serif" fill="url(#grad)">
    A
  </text>

  <!-- Superscript U -->
  <text x="120" y="78" font-size="42" font-weight="600" font-family="Poppins, Inter, Arial, sans-serif" fill="#FFFFFF">
    U
  </text>
</svg>
