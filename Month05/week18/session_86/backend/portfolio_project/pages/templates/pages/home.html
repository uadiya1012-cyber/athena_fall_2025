<!-- pages/templates/pages/home.html -->
{% extends "pages/base.html" %}

{% block title %}{{name}} - {{ title }}{% endblock %}

{% block extra_css %}

<style>
    .hero {
        text-align: center;
        padding: 4rem 0;
    }

    .hero h1 {
        font-size: 3rem;
        margin-bottom: 0.5rem;
    }

    .hero title {
        font-size: 1.5rem;
        color: #3498db;
        margin-bottom: 1rem;
    }

    .hero .tagline {
        font-size: 1.2rem;
        color: #666;
    }

    .cta-button {
        margin-top: 2rem;
        display: flex;
        justify-content: center;
        gap: 1rem;
    }

    .btn {
        padding: 0.75rem 1.5rem;
        border-radius: 5px;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s;
    }

    .btn-primary {
        background-color: #3498db;
        color: #fff;
    }

    .btn-primary:hover {
        background-color: #2980b9;
    }

    .btn-secondary {
        background-color: #2c3e50;
        color: #ecf0f1;
    }

    .btn-secondary:hover {
        background-color: #1a252f;
    }
</style>

{% endblock %}

{% block content %}
<section class="hero">
    <h1>Сайн байна уу! Би {{ name }}.</h1>
    <p class="title">{{ title }}</p>
    <p class="tagline">{{ tagline }}</p>

    <div class="cta-buttons">
        <a href="{% url 'projects' %}" class="btn btn-primary">Миний төслүүд</a>
        <a href="{% url 'contact' %}" class="btn btn-secondary">Холбоо барих</a>
    </div>
</section>
{% endblock %}
