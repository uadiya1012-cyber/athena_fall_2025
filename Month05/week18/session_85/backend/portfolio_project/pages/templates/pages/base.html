<!-- pages/templates/pages/base.html -->
<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Миний Вэб Портфолио{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        /* navigation */
        nav {
            background-color: #2c3e50;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        nav a {
            color: #ecf0f1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #3498db;
        }

        /* main content */
        main {
            min-height: calc(100vh - 160px);
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* footer */
        footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 1rem;
        }

        /* responsive styles */
        @media (max-width: 768px) {
            nav ul {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            main {
                padding: 1rem;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body>
    <nav>
        <ul>
            <li><a href="{% url 'home' %}">Нүүр</a></li>
            <li><a href="{% url 'about' %}">Тухай</a></li>
            <li><a href="{% url 'projects' %}">Төслүүд</a></li>
            <li><a href="{% url 'contact' %}">Холбоо барих</a></li>
        </ul>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Адъяахүү. Миний Вэб Портфолио. Бүх эрх хуулиар хамгаалагдсан.</p>
    </footer>
</body>

</html>
